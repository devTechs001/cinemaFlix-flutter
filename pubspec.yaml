name: cinemaflix
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  video_player: ^2.11.1
  chewie: ^1.13.1
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  share_plus: ^10.0.0
  shared_preferences: ^2.5.5
  system_tray: ^0.1.1
  cached_network_image: ^3.4.1
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/sounds/
