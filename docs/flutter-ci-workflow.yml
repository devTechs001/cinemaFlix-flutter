# Copy this file to .github/workflows/flutter.yml to enable CI.
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml bundles `.env` as an asset, and the real one is
      # git-ignored — create a dummy so pub get/analyze/test can run.
      - name: Create dummy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
